name: X3 firmware (manual)

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: x3-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-x3-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e default
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
      - name: Build
        run: pio run -e default
      - name: Check size
        id: size
        run: |
          SIZE=$(stat -c%s .pio/build/default/firmware.bin)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "firmware.bin: $SIZE bytes (partition limit 6553600)" >> "$GITHUB_STEP_SUMMARY"
          echo "$SIZE" > size.txt
          test "$SIZE" -lt 6553600
      - name: Upload size marker
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: size-${{ steps.size.outputs.size }}
          path: size.txt
      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: x3-firmware
          path: .pio/build/default/firmware.bin
          if-no-files-found: error
      - name: Publish release for over-the-air update
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete x3-latest --cleanup-tag --yes || true
          gh release create x3-latest .pio/build/default/firmware.bin \
            --title "X3 latest" --notes "Build ${GITHUB_SHA}" --prerelease --target "${GITHUB_SHA}"
